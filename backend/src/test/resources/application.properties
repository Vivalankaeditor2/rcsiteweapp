# Tests run against a throwaway in-memory DB; the production schema is frozen
# (D-004) and is never created or altered here.
spring.datasource.url=jdbc:h2:mem:rcsitetest;MODE=MySQL;DB_CLOSE_DELAY=-1
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=none
spring.jpa.open-in-view=false