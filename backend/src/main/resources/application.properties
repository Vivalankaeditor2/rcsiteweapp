spring.application.name=rcsite-backend
# Local dev datasource (direct JDBC). For WildFly deployment use the 'wildfly'
# profile, which reads the JNDI datasource java:/jdbc/rcsite (D-017).
# Credentials are injected at run time (D-005); never commit values.
spring.datasource.url=${DB_URL:jdbc:mariadb://localhost:3306/vivalanka}
spring.datasource.username=${DB_USER:rcsite}
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.driver-class-name=org.mariadb.jdbc.Driver
spring.datasource.hikari.pool-name=rcsite-pool
# The schema is fixed and owner-provided (D-004, D-008): never create or alter.
spring.jpa.hibernate.ddl-auto=none
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MariaDBDialect
spring.jpa.properties.hibernate.jdbc.time_zone=UTC
spring.jpa.properties.hibernate.format_sql=false
server.port=${SERVER_PORT:8080}
server.error.include-message=never
# Swagger UI / OpenAPI
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.api-docs.path=/v3/api-docs
# Cache (config lookups)
spring.cache.cache-names=rcsiteConfig
spring.cache.caffeine.spec=maximumSize=2000,expireAfterWrite=5m
# Logging
logging.level.root=INFO
logging.level.com.rev_creations.rcsite=INFO
# Sitemap generation (D-020, D-025). base-url is the canonical host the legacy
# page used (Config "wwwUrl"); kept configurable because the local seed data has
# no such row. No secret involved.
rcsite.sitemap.base-url=${SITEMAP_BASE_URL:https://www.vivalanka.com}
rcsite.sitemap.shard-size=${SITEMAP_SHARD_SIZE:10000}
rcsite.sitemap.max-shards=${SITEMAP_MAX_SHARDS:204}
# Search is proxied to the existing Apache Solr (D-011). base-url+request-handler
# is the legacy endpoint and the public /rcsearch/news contract. Fail-open keeps
# the site rendering if Solr is down; a short timeout fails fast. No secret.
rcsite.solr.base-url=${SOLR_BASE_URL:https://www.vivalanka.com/rcsearch}
rcsite.solr.request-handler=${SOLR_REQUEST_HANDLER:/news}
rcsite.solr.rows=${SOLR_ROWS:20}
rcsite.solr.max-rows=${SOLR_MAX_ROWS:100}
rcsite.solr.connect-timeout-ms=${SOLR_CONNECT_TIMEOUT_MS:1000}
rcsite.solr.read-timeout-ms=${SOLR_READ_TIMEOUT_MS:3000}
rcsite.solr.fail-open=${SOLR_FAIL_OPEN:true}
# Feed ingestion (the FeedGenerator/SearchUpdater port) and RSS output. The
# scheduler polls active feed_channel rows, stages items in feed_article and
# logs each attempt in feed_channel_log. rss-category-id defaults to 7 and
# rss-items to 10, matching the legacy FeedGenerator servlet. No secret.
rcsite.feed.scheduler-enabled=${FEED_SCHEDULER_ENABLED:true}
rcsite.feed.poll-delay-ms=${FEED_POLL_DELAY_MS:60000}
rcsite.feed.connect-timeout-ms=${FEED_CONNECT_TIMEOUT_MS:5000}
rcsite.feed.read-timeout-ms=${FEED_READ_TIMEOUT_MS:10000}
rcsite.feed.max-items-per-poll=${FEED_MAX_ITEMS_PER_POLL:200}
rcsite.feed.user-agent=${FEED_USER_AGENT:VivaLankaFeedPoller/1.0}
rcsite.feed.default-poll-interval-minutes=${FEED_DEFAULT_POLL_INTERVAL_MINUTES:60}
rcsite.feed.batch-size=${FEED_BATCH_SIZE:20}
rcsite.feed.rss-title=VivaLanka.com Sri Lanka Latest News.
rcsite.feed.rss-description=Current and up to date news and events for global Sri Lankan community.
rcsite.feed.rss-copyright=Copyright 2010 VivaLanka.com
rcsite.feed.rss-base-url=${FEED_RSS_BASE_URL:https://www.vivalanka.com}
rcsite.feed.rss-items=${FEED_RSS_ITEMS:10}
rcsite.feed.rss-category-id=${FEED_RSS_CATEGORY_ID:7}